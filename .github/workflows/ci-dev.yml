name: ci-dev

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  dev-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y just libglpk-dev

      - name: Restore renv
        run: |
          Rscript --vanilla -e "if (!requireNamespace('renv', quietly = TRUE)) install.packages('renv', repos='https://cloud.r-project.org')"
          Rscript --vanilla -e "source('renv/activate.R'); renv::restore(prompt = FALSE)"

      - name: Run tests
        run: just test

      - name: Run dev DAG
        run: just dev

      - name: Run Bayesian check DAG
        run: just bayes-check
