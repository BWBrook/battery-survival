name: ci-full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  full-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Restore renv
        run: |
          Rscript --vanilla -e "if (!requireNamespace('renv', quietly = TRUE)) install.packages('renv', repos='https://cloud.r-project.org')"
          Rscript --vanilla -e "source('renv/activate.R'); renv::restore(prompt = FALSE)"

      - name: Run full DAG
        run: just full

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: battery-survival-full-artifacts
          path: outputs/
