default:
  seed: 20260217
  data_file: "data/batt_life_aug22.csv"
  exclusions_file: "config/exclusions.csv"
  outputs_dir: "outputs"
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  qc_dir: "outputs/qc"
  models_dir: "outputs/models"
  manuscript_qmd: "manuscript/paper.qmd"
  manuscript_output_dir: "outputs/manuscript"
  cost_scenarios_file: "config/cost_scenarios.csv"
  battery_costs_file: "config/battery_costs.csv"
  render_manuscript: false
  render_formats:
    - html
  economics:
    interval_min: 30
    interval_max: 365
    interval_by: 7
  partitions:
    train_regions:
      - ct
      - se
      - nw
      - wt
    validation_regions:
      - sw
    descriptive_regions:
      - ne
    testbench_regions:
      - tb
  validation:
    horizons_days:
      - 90
      - 180
      - 270
      - 365
  bayesian:
    enabled: false
    backend: cmdstanr
    formula: "rd | cens(cens) ~ bb + ft + seas + log_fi_pd + log_day_pd"
    chains: 4
    cores: 4
    threads_per_chain: 1
    iter_warmup: 1000
    iter_sampling: 1000
    adapt_delta: 0.95
    max_treedepth: 12
    refresh: 0
    init: 0
    gate:
      rhat_max: 1.01
      bulk_ess_min: 400
      max_divergences: 0
    families:
      - weibull
      - lognormal
      - gamma
  model:
    cox_formula: "Surv(rd, event) ~ bb + ft + seas + log_fi_pd + log_day_pd + strata(reg)"
    aft_formula: "Surv(rd, event) ~ bb + ft + seas + log_fi_pd + log_day_pd"
    aft_distributions:
      - weibull
      - lognormal
      - loglogistic
dev:
  sample_n: 1200
  render_manuscript: false
  render_formats:
    - html
full:
  sample_n: null
  render_manuscript: true
  render_formats:
    - html
    - pdf
bayes:
  sample_n: null
  render_manuscript: true
  render_formats:
    - html
    - pdf
  bayesian:
    enabled: true
    chains: 8
    cores: 8
    threads_per_chain: 1
    iter_warmup: 1000
    iter_sampling: 1000
bayes_prod:
  sample_n: null
  render_manuscript: false
  render_formats:
    - html
  bayesian:
    enabled: true
    chains: 32
    cores: 32
    threads_per_chain: 1
    iter_warmup: 1000
    iter_sampling: 1000
    adapt_delta: 0.95
    max_treedepth: 12
    families:
      - weibull
      - lognormal
      - gamma
bayes_check:
  sample_n: 1200
  render_manuscript: false
  render_formats:
    - html
  bayesian:
    enabled: true
    chains: 8
    cores: 8
    threads_per_chain: 1
    iter_warmup: 500
    iter_sampling: 500
    adapt_delta: 0.9
    max_treedepth: 10
    families:
      - weibull
