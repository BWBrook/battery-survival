  name: "ne"
  region: "ne"
  ftype: "*"
  btype: "*"
  basic: "seas"
  form: "seas + fpd + dpd"
  colv: !expr c(2, 3, 4)
ne_wb:
  name: "ne_wb"
  inherits: ne
  haz: "weibull"
  opts: !expr NULL
ne_bs_5:
