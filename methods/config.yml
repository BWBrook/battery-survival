default:
  in_dat: "../data/2021-06-28/batt_life_final.csv"
  col_types: "fiiiifffff"
  out_dir: "../results/"
  run_date: "2021-07-09"
  lhs: "Surv(rd, bdead) ~"
  region: "*"
  ftype: "*"
  btype: "*"
  chains: 4
  cores: 4
  seed: 1337
  iter: 4000
#------------------
# Test Bench Data
#------------------
tb:
  name: "tb"
  region: "tb"
  ftype: "*"
  btype: "*"
  basic: "1"
  form: !expr NULL
tb_wb:
  name: "tb_wb"
  inherits: tb
  haz: "weibull"
  opts: !expr NULL
tb_bs:
  name: "tb_bs_5"
  inherits: tb
  haz: "bs"
  opts: !expr list(df = 5)
tb_bs_7:
  name: "tb_bs_7"
  inherits: tb_bs
  opts: !expr list(df = 7)
tb_ms:
  name: "tb_ms_5"
  inherits: tb
  haz: "ms"
  opts: !expr list(df = 5)
tb_ms_7:
  name: "tb_ms_7"
  inherits: tb_ms
  opts: !expr list(df = 7)

#------------------
# South West Region 
#------------------
sw:
  name: "sw" 
  region: "sw"
  ftype: "*"
  btype: "*"
  basic: "bb"
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
sw_wb:
  name: "sw_wb"
  inherits: sw
  haz: "weibull"
  opts: !expr NULL
sw_bs_5:
  name: "sw_bs_5"
  inherits: sw
  haz: "bs"
  opts: !expr list(df = 5)
sw_bs_7:
  name: "sw_bs_7"
  inherits: sw_bs_5
  opts: !expr list(df = 7)
sw_ms_5:
  name: "sw_ms_5"
  inherits: sw
  haz: "ms"
  opts: !expr list(df = 5)
sw_ms_7:
  name: "sw_ms_7"
  inherits: sw_ms_5
  opts: !expr list(df = 7)

#------------------
# North East Region 
#------------------
