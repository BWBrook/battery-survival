#--------------
# TASCAM Region
#--------------
tascam: 
  region: "se|nw|ct|wt"
# TASCAM i experiments
#---------------------
tascam_i:
  inherits: tascam
  name: "tascam_i"
  ftype: "i"
  btype: "Procell|Varta"
  basic: "bb"
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
tascam_i_wb:
  name: "tascam_i_wb"
  inherits: tascam_i
  haz: "weibull"
  opts: !expr NULL
tascam_i_bs_5:
  name: "tascam_i_bs_5"
  inherits: tascam_i
  haz: "bs"
  opts: !expr list(df = 5)
tascam_i_bs_7:
