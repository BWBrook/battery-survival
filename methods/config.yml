default:
  in_dat	    : "../data/2021-06-28/batt_life_final.csv"
  col_types   : "fiiiifffff"
#------------------
# South West Region 
#------------------
sw: 
  region: "sw"
mod_sw_kw: 
  inherits: sw
  type: "kw"
  form: "bb"
mod_sw_cox:
  inherits: sw
  type: "cox"
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
#------------------
# North East Region 
#------------------
ne:
  region: "ne"
mod_ne_kw: 
  inherits: ne
  type: "kw"
  form: "seas"
mod_ne_cox:
  inherits: ne
  type: "cox"
  form: "seas + fpd + dpd"
  colv: !expr c(2, 3, 4)
#--------------
# TASCAM Region
#--------------
tascam: 
  region: !expr c("se","nw","ct","wt")
# TASCAM i experiments
#---------------------
tascam_i:
  inherits: tascam
  ftype: "i"
  btype: !expr c("Procell", "Varta")
mod_tci_kw:
  inherits: tascam_i
  form: "bb"
mod_tci_cox:
  inherits: tascam_i
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
# TASCAM w experiments
#---------------------
tascam_w:
  inherits: tascam
  ftype: "w"
  btype: !expr all()
mod_tcw_kw:
  inherits: tascam_w
  form: "bb"
mod_tcw_cox:
  inherits: tascam_w
  form: "bb + seas + fpd + dpd"
  colv: !expr c(1, 2, 3, 4)
# TASCAM v experiments
#---------------------
tascam_v:
  inherits: tascam
  ftype: !expr all()
  btype: "Varta"

