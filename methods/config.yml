default:
  in_dat: "../data/2021-06-28/batt_life_final.csv"
  col_types: "fiiiifffff"
  out_dir: "../results/"
  run_date: "2021-07-09"
  lhs: "Surv(rd, bdead) ~"
  region: "*"
  ftype: "*"
  btype: "*"
#------------------
# Test Bench Data
#------------------
tb:
  name: "tb"
  region: "tb"
  ftype: "*"
  btype: "*"
  basic: "1"
#------------------
# South West Region 
#------------------
sw:
  name: "sw" 
  region: "sw"
  ftype: "*"
  btype: "*"
  basic: "bb"
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
#------------------
# North East Region 
#------------------
ne:
  name: "ne"
  region: "ne"
  ftype: "*"
  btype: "*"
  basic: "seas"
  form: "seas + fpd + dpd"
  colv: !expr c(2, 3, 4)
#--------------
# TASCAM Region
#--------------
tascam: 
  region: "se|nw|ct|wt"
# TASCAM i experiments
#---------------------
tascam_i:
  inherits: tascam
  name: "tascam_i"
  ftype: "i"
  btype: "Procell|Varta"
  basic: "bb"
  form: "bb + fpd + dpd"
  colv: !expr c(1, 3, 4)
# TASCAM w experiments
#---------------------
tascam_w:
  inherits: tascam
  name: "tascam_w"
  ftype: "w"
  btype: "*"
  basic: "bb"
  form: "bb + seas + fpd + dpd"
  colv: !expr c(1, 2, 3, 4)
# TASCAM v experiments
#---------------------
tascam_v:
  inherits: tascam
  name: "tascam_v"
  ftype: "*"
  btype: "Varta"

